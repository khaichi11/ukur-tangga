# Membuat APK "Rekam Ukur Tangga" dan menaruhnya di Releases (tag android-terbaru), sehingga bisa diunduh
# langsung dari browser HP: https://github.com/<pemilik>/ukur-tangga/releases/latest/download/rekam-ukur-tangga.apk
name: APK Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rekam-ukur-tangga.apk
          gh release delete android-terbaru --yes --cleanup-tag || true
          gh release create android-terbaru rekam-ukur-tangga.apk --latest \
            --title "Rekam Ukur Tangga (Android)" \
            --notes "Perekam dua kamera untuk Android. Unduh rekam-ukur-tangga.apk dari HP lalu buka untuk memasang."
